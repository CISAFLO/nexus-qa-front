<!DOCTYPE html>
<html>
<head>
    <title>Nexus QA - Copiloto de Estrategia</title> <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="chat-container">
        <div id="welcome-header">
            <h1>¡Hola! Soy <span>Nexus QA</span></h1>
            <p>Tu copiloto de élite para la Estrategia de Calidad.</p>
        </div>

        <div id="thread-history">
            <h3>Chat History</h3>
            <div id="messages-container"></div>
        </div>
        
        <textarea id="user-input" placeholder="¿En qué estrategia de calidad trabajaremos hoy?"></textarea>
        
        <div id="button-container">
            <button id="new-thread-btn">New Chat</button>
            <button id="send-btn">Send</button>
            <button id="voice-input-btn">🎤</button>
            <input type="file" id="file-input" multiple style="display: none;" />
            <label for="file-input" id="file-input-label">📂 0 Files</label>
        </div>        
        <div id="logs"></div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
